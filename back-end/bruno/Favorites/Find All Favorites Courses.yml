info:
  name: Find All Favorites Courses
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/favorites"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3333

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
