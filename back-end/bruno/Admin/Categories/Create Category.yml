info:
  name: Create Category
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/management/categories"
  headers:
    - name: Cookie
      value: token={{adminToken}}
  body:
    type: json
    data: |-
      {
        "name": "Teste",
        "position": 8
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
