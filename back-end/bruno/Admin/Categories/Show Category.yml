info:
  name: Show Category
  type: http
  seq: 3

http:
  method: GET
  url: "{{adminUrl}}/categories/:id"
  headers:
    - name: Cookie
      value: token={{adminToken}}
  params:
    - name: id
      value: "7"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
