info:
  name: Get all Courses
  type: http
  seq: 1

http:
  method: GET
  url: "{{adminUrl}}/courses"
  headers:
    - name: Cookie
      value: token={{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
