info:
  name: Create Thumbnai
  type: http
  seq: 6

http:
  method: POST
  url: "{{adminUrl}}/courses/:id/thumbnai-upload"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "contentType": "image/png",
        "size": 123
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
