info:
  name: Create Course
  type: http
  seq: 3

http:
  method: POST
  url: "{{adminUrl}}/courses"
  headers:
    - name: Cookie
      value: token={{adminToken}}
  body:
    type: json
    data: |-
      {
        "name": "Teste 3",
        "synopsis": "Lorem",
        "categoryId": 1555
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
