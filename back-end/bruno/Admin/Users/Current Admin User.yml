info:
  name: "Current Admin User "
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/current"
  headers:
    - name: Cookie
      value: token={{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
