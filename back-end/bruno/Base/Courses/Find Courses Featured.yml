info:
  name: Find Courses Featured
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/courses/featured"
  headers:
    - name: Cookie
      value: token={{adminToken}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
