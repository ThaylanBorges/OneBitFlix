info:
  name: Newest Courses
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/courses/newest"
  headers:
    - name: Cookie
      value: token={{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
