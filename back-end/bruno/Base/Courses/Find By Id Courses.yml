info:
  name: Find By Id Courses
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/courses/:id"
  headers:
    - name: Cookie
      value: token={{adminToken}}
  params:
    - name: id
      value: "2"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
