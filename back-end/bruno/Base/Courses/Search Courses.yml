info:
  name: Search Courses
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/courses/search/?name=A "
  headers:
    - name: Cookie
      value: token={{adminToken}}
  params:
    - name: name
      value: "A "
      type: query
    - name: page
      value: ""
      type: query
      disabled: true
    - name: perPage
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
