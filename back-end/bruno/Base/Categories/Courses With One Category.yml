info:
  name: Courses With One Category
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/categories/:id/courses"
  headers:
    - name: Cookie
      value: token={{adminToken}}
  params:
    - name: id
      value: "155"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
